[package]
name = "slideguard-backend"
version = "0.1.0"
edition = "2021"
description = "Backend en tiempo real para el ecosistema de prediccion y alerta temprana de deslizamientos de tierra"

[lib]
name = "slideguard_backend"
path = "src/lib.rs"

[[bin]]
name = "slideguard-backend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
once_cell = "1"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
