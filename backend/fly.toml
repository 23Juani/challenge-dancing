app = "challenge-dancing"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  HTTP_HOST = "0.0.0.0"
  HTTP_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"
